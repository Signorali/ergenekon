name: 🚀 Release

# Tetikleyici: git tag v* push edildiğinde
# Kullanım:
#   1. CHANGELOG.md'ye yeni sürüm bölümü ekle
#   2. git tag v3.4.0
#   3. git push --tags
#   → GitHub Release otomatik oluşturulur

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Sürüm: $VERSION"

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # CHANGELOG.md'den ilgili sürüm bölümünü çıkar
          CHANGELOG=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Bu sürüm için değişiklik notu bulunamadı.\n\nNo changelog found for this version.\n\nBkz. / See: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
          fi

          # Multiline output için delimiter kullan
          {
            echo "content<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const tag = '${{ steps.version.outputs.tag }}';
            const changelog = `${{ steps.changelog.outputs.content }}`;

            const body = [
              `## 🆕 Umay ${version}`,
              '',
              changelog,
              '',
              '---',
              '',
              '### 🐳 Docker Hub',
              '```bash',
              '# Güncelle / Update',
              'docker compose pull && docker compose up -d',
              '```',
              '',
              `**Docker Hub:** https://hub.docker.com/r/signorali/umay-backend/tags?name=${version}`,
              '',
              '### 📦 Yeni Kurulum / Fresh Install',
              '```bash',
              'curl -fsSL https://get.umay.app/install | sudo bash',
              '```',
            ].join('\n');

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Umay ${version}`,
              body: body,
              draft: false,
              prerelease: version.includes('-'),
            });

            console.log(`✅ Release ${version} oluşturuldu`);
