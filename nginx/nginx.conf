
# ─── Ergenekon HTTPS Proxy ────────────────────────────────────────────────────
# Umay   → https://localhost       (port 443)
# Ötüken → https://localhost:4443  (port 4443)
# HTTP   → https redirect          (port 80)
# ─────────────────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;

    # ── Nginx sürümünü gizle ──────────────────────────────────────────────────
    server_tokens off;

    # ── WebSocket desteği (Vite HMR için gerekli) ─────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── SSL Global ────────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── Docker Internal DNS — container IP değişince yeniden çözümle ─────────
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Proxy Global ──────────────────────────────────────────────────────────
    proxy_http_version  1.1;
    proxy_set_header    Host               $host;
    proxy_set_header    X-Real-IP          $remote_addr;
    # GÜVENLİK: $remote_addr — istemcinin gönderdiği X-Forwarded-For her zaman
    # OVERRIDE edilir. $proxy_add_x_forwarded_for spoofing'e açıktı (saldırgan
    # kendi header'ını ekleyip rate-limit/lockout bypass edebiliyordu).
    proxy_set_header    X-Forwarded-For    $remote_addr;
    proxy_set_header    X-Forwarded-Proto  $scheme;
    proxy_set_header    Upgrade            $http_upgrade;
    proxy_set_header    Connection         $connection_upgrade;
    proxy_cache_bypass  $http_upgrade;
    proxy_read_timeout  300s;
    proxy_connect_timeout 75s;
    client_max_body_size  50m;

    # ── Rate Limiting ─────────────────────────────────────────────────────────
    # Login endpoint: max 5 istek/dakika (brute-force koruması)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    # Genel API: max 120 istek/dakika
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=120r/m;
    # Rate limit aşıldığında 429 döndür
    limit_req_status 429;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── UMAY — port 443 ───────────────────────────────────────────────────────
    server {
        listen      443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Güvenlik başlıkları
        add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options              "SAMEORIGIN"                          always;
        add_header X-Content-Type-Options       "nosniff"                             always;
        add_header X-XSS-Protection            "1; mode=block"                       always;
        add_header Referrer-Policy             "strict-origin-when-cross-origin"     always;
        add_header Permissions-Policy          "camera=(), microphone=(), geolocation=()" always;
        # CSP — script-src'den 'unsafe-inline' ve 'unsafe-eval' kaldırıldı.
        # Vite production build inline/eval kullanmaz. style-src için
        # 'unsafe-inline' korundu (React inline-style attribute kullanır).
        add_header Content-Security-Policy     "default-src 'self' https:; script-src 'self' blob: https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' wss: ws: https:; worker-src blob: 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

        # Frontend
        location / {
            set $umay_frontend http://umay-frontend:80;
            proxy_pass $umay_frontend;
        }

        # Auth endpoint — rate limiting (brute-force koruması)
        location ~ ^/api/v1/auth/(login|token) {
            limit_req zone=auth_limit burst=3 nodelay;
            set $umay_backend http://umay-backend:8000;
            proxy_pass $umay_backend;
        }

        # API
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            set $umay_backend http://umay-backend:8000;
            proxy_pass $umay_backend;
        }

        # Ötüken API proxy — Umay frontend'den cross-system çağrılar için
        # fetch('/otuken-api/api/v1/geo/farms') → http://otuken-backend:8080/api/v1/geo/farms
        location /otuken-api/ {
            proxy_pass http://otuken-backend:8080/;
        }

        # Uptime-Kuma izleme paneli — sadece sistem yöneticisi içindir.
        # Trailing slash önemli: /uptime/ → http://uptime-kuma:3001/
        location /uptime/ {
            set $uptime_kuma http://uptime-kuma:3001;
            proxy_pass $uptime_kuma/;
            # WebSocket desteği — Uptime-Kuma realtime push için socket.io kullanır
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ── ÖTÜKEN — port 4443 ────────────────────────────────────────────────────
    server {
        listen      4443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Güvenlik başlıkları
        add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options              "SAMEORIGIN"                          always;
        add_header X-Content-Type-Options       "nosniff"                             always;
        add_header X-XSS-Protection            "1; mode=block"                       always;
        add_header Referrer-Policy             "strict-origin-when-cross-origin"     always;
        add_header Permissions-Policy          "camera=(), microphone=(), geolocation=()" always;
        # CSP — script-src'den 'unsafe-inline' ve 'unsafe-eval' kaldırıldı.
        # Vite production build inline/eval kullanmaz. style-src için
        # 'unsafe-inline' korundu (React inline-style attribute kullanır).
        add_header Content-Security-Policy     "default-src 'self' https:; script-src 'self' blob: https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' wss: ws: https:; worker-src blob: 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

        # Frontend (nginx production build — port 80)
        location / {
            set $otuken_frontend http://otuken-frontend:80;
            proxy_pass $otuken_frontend;
        }

        # Auth endpoint — rate limiting
        location ~ ^/api/v1/auth/(login|token) {
            limit_req zone=auth_limit burst=3 nodelay;
            set $otuken_backend http://otuken-backend:8080;
            proxy_pass $otuken_backend;
        }

        # API
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            set $otuken_backend http://otuken-backend:8080;
            proxy_pass $otuken_backend;
        }

        # Umay API proxy — Ötüken frontend'den cross-system çağrılar için
        # fetch('/umay-api/api/v1/accounts') → http://umay-backend:8000/api/v1/accounts
        location /umay-api/ {
            proxy_pass http://umay-backend:8000/;
        }
    }
}
